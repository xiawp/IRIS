<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>IRIS</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- ================= ПЕРЕОПРЕДЕЛЕНИЕ СТИЛЕЙ ================= -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* Полноэкранный контейнер — растягивается на всё окно (и на весь iframe) */
      #unity-container,
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
      }

      /* Канвас на весь экран */
      #unity-canvas,
      #unity-canvas.unity-mobile {
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #000;
        outline: none;
      }

      /* ---------- Лоадер: фиолетовый, монотонный ---------- */
      #unity-loading-bar {
        position: absolute !important;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: 320px !important;
        max-width: 80vw !important;
        height: auto !important;
        display: none;
        text-align: center;
        z-index: 10;
      }

      /* Прячем стандартный логотип Unity, чтобы не мешал */
      #unity-logo {
        display: none !important;
      }

      #unity-progress-bar-empty {
        width: 100% !important;
        height: 10px !important;
        margin: 0 !important;
        background: rgba(168, 85, 247, 0.20) !important;
        background-image: none !important;
        border: 1px solid rgba(168, 85, 247, 0.65) !important;
        border-radius: 999px !important;
        overflow: hidden;
        box-shadow: 0 0 18px rgba(168, 85, 247, 0.35);
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100% !important;
        margin: 0 !important;
        background-image: linear-gradient(90deg, #7c3aed 0%, #a855f7 50%, #d8b4fe 100%) !important;
        border-radius: 999px !important;
        transition: width 0.15s linear;
      }

      /* Надпись Loading... — монотонная (сплошной фиолетовый, без свечения и пульсации) */
      #unity-loading-text {
        margin-top: 16px;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #a855f7;
        user-select: none;
      }

      /* Футер (кнопка фуллскрина) — поверх канваса, в правом нижнем углу */
      #unity-footer {
        position: absolute !important;
        right: 10px !important;
        bottom: 10px !important;
        left: auto !important;
        top: auto !important;
        z-index: 5;
      }

      #unity-warning {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
      }
    </style>
    <!-- ========================================================== -->
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-loading-text">Loading</div>
      </div>

      <div id="unity-warning"></div>

      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">IRIS</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Временное сообщение-баннер (или постоянная ошибка поверх канваса).
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/IRIS.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/IRIS.data",
        frameworkUrl: buildUrl + "/IRIS.framework.js",
        codeUrl: buildUrl + "/IRIS.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "IRIS",
        productVersion: "0.0.12",
        showBanner: unityShowBanner,
      };

      // Канвас всегда подстраивается под размер DOM-элемента (наш 100%x100%)
      config.matchWebGLToCanvasSize = true;

      // На мобильных дополнительно понижаем разрешение для производительности
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        config.devicePixelRatio = 1;
      }

      var loadingBar = document.querySelector("#unity-loading-bar");
      var loadingText = document.querySelector("#unity-loading-text");
      var progressFull = document.querySelector("#unity-progress-bar-full");

      loadingBar.style.display = "block";

      // Анимация точек: Loading. -> Loading.. -> Loading... -> Loading.
      var dots = 0;
      var loadingInterval = setInterval(function () {
        dots = (dots % 3) + 1;
        loadingText.textContent = "Loading" + ".".repeat(dots);
      }, 400);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressFull.style.width = (100 * progress) + "%";
        }).then((unityInstance) => {
          clearInterval(loadingInterval);
          loadingBar.style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          clearInterval(loadingInterval);
          loadingText.textContent = "Loading error";
          loadingText.style.color = "#ff5555";
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
